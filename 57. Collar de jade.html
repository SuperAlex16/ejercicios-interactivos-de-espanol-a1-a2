<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collar de jade</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #dff3ff, #c8ecff, #eef9ff);
      font-family: Georgia, "Times New Roman", serif;
      color: #16384c;
      line-height: 1.8;
      padding: 30px 14px;
    }

    .contenedor {
      max-width: 1080px;
      margin: auto;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #9bd3ef;
      border-radius: 30px;
      box-shadow: 0 18px 42px rgba(23, 86, 118, 0.18);
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 34px 24px 24px;
      background: rgba(255, 255, 255, 0.58);
      border-bottom: 1px solid #9bd3ef;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 5vw, 3.5rem);
      color: #175676;
      letter-spacing: 0.02em;
    }

    main {
      padding: 34px;
    }

    .historia {
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid #b9e3f7;
      border-radius: 24px;
      padding: 30px;
      font-size: 1.12rem;
    }

    p {
      margin: 0 0 1.15rem;
    }

    .dialogo {
      padding-left: 1rem;
      border-left: 4px solid #8ecae6;
    }

    .verbo-visible {
      color: #175676;
      font-weight: bold;
      background: #ffffff;
      border: 1px solid #8ecae6;
      border-radius: 999px;
      padding: 3px 10px;
      box-shadow: 0 4px 10px rgba(47, 128, 168, 0.10);
    }

    select {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      color: #175676;
      background: white;
      border: 2px solid #8ecae6;
      border-radius: 999px;
      padding: 5px 12px;
      margin: 2px;
      min-width: 165px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(47, 128, 168, 0.12);
    }

    select:focus {
      outline: none;
      border-color: #175676;
      box-shadow: 0 0 0 4px rgba(47, 128, 168, 0.15);
    }

    select.correcto {
      border-color: #2e7d32;
      background: #e8f5e9;
    }

    select.incorrecto {
      border-color: #b3261e;
      background: #fdecea;
    }

    .botones {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    button {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    #revisar {
      background: linear-gradient(135deg, #175676, #2f80a8);
      color: white;
      box-shadow: 0 10px 22px rgba(23, 86, 118, 0.28);
    }

    #reiniciar {
      background: white;
      color: #175676;
      border: 1px solid #8ecae6;
      box-shadow: 0 8px 18px rgba(23, 86, 118, 0.12);
    }

    #resultado {
      margin-top: 20px;
      text-align: center;
      color: #175676;
      font-weight: bold;
      font-size: 1.15rem;
    }

    .puntaje {
      display: inline-block;
      background: white;
      border: 1px solid #8ecae6;
      border-radius: 999px;
      padding: 8px 18px;
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <header>
      <h1>Collar de jade</h1>
    </header>

    <main>
      <section class="historia" id="historia"></section>

      <div class="botones">
        <button id="revisar">revisar</button>
        <button id="reiniciar">reiniciar</button>
      </div>

      <div id="resultado"></div>
    </main>
  </div>

  <script>
    const verbos = {
      v02: { infinitivo: "llevarse", respuesta: "se llevaban", formas: ["se llevan", "se han llevado", "se llevaron", "se llevaban", "se habían llevado", "se lleven", "se están llevando", "se van a llevar"] },
      v03: { infinitivo: "compartir", respuesta: "compartían", formas: ["comparten", "han compartido", "compartieron", "compartían", "habían compartido", "compartan", "están compartiendo", "van a compartir"] },
      v04: { infinitivo: "preparar", respuesta: "preparaban", formas: ["preparan", "han preparado", "prepararon", "preparaban", "habían preparado", "preparen", "están preparando", "van a preparar"] },
      v05: { infinitivo: "contar", respuesta: "contaban", formas: ["cuentan", "han contado", "contaron", "contaban", "habían contado", "cuenten", "están contando", "van a contar"] },

      v06: { infinitivo: "volver", respuesta: "volvió", formas: ["vuelve", "ha vuelto", "volvió", "volvía", "había vuelto", "vuelva", "está volviendo", "va a volver"] },
      v07: { infinitivo: "notar", respuesta: "notó", formas: ["nota", "ha notado", "notó", "notaba", "había notado", "note", "está notando", "va a notar"] },
      v08: { infinitivo: "pertenecer", respuesta: "había pertenecido", formas: ["pertenece", "ha pertenecido", "perteneció", "pertenecía", "había pertenecido", "pertenezca", "está perteneciendo", "va a pertenecer"] },
      v09: { infinitivo: "desaparecer", respuesta: "había desaparecido", formas: ["desaparece", "ha desaparecido", "desapareció", "desaparecía", "había desaparecido", "desaparezca", "está desapareciendo", "va a desaparecer"] },
      v10: { infinitivo: "llamar", respuesta: "llamó", formas: ["llama", "ha llamado", "llamó", "llamaba", "había llamado", "llame", "está llamando", "va a llamar"] },
      v11: { infinitivo: "saber", respuesta: "sabía", formas: ["sabe", "ha sabido", "supo", "sabía", "había sabido", "sepa", "está sabiendo", "va a saber"] },

      v12: { infinitivo: "poder", respuesta: "pudo", formas: ["puede", "ha podido", "pudo", "podía", "había podido", "pueda", "está pudiendo", "va a poder"] },
      v13: { infinitivo: "llamar", respuesta: "llamó", formas: ["llama", "ha llamado", "llamó", "llamaba", "había llamado", "llame", "está llamando", "va a llamar"] },
      v14: { infinitivo: "ser", respuesta: "era", formas: ["es", "ha sido", "fue", "era", "había sido", "sea", "está siendo", "va a ser"] },
      v15: { infinitivo: "llegar", respuesta: "llegó", formas: ["llega", "ha llegado", "llegó", "llegaba", "había llegado", "llegue", "está llegando", "va a llegar"] },
      v16: { infinitivo: "revisar", respuesta: "revisaba", formas: ["revisa", "ha revisado", "revisó", "revisaba", "había revisado", "revise", "está revisando", "va a revisar"] },
      v17: { infinitivo: "rezar", respuesta: "rezaba", formas: ["reza", "ha rezado", "rezó", "rezaba", "había rezado", "rece", "está rezando", "va a rezar"] },

      v18: { infinitivo: "esperar", respuesta: "espero", formas: ["espero", "he esperado", "esperé", "esperaba", "había esperado", "espere", "estoy esperando", "voy a esperar"] },
      v19: { infinitivo: "encontrar", respuesta: "encuentres", formas: ["encuentras", "has encontrado", "encontraste", "encontrabas", "habías encontrado", "encuentres", "estás encontrando", "vas a encontrar"] },
      v20: { infinitivo: "decir", respuesta: "dijo", formas: ["dice", "ha dicho", "dijo", "decía", "había dicho", "diga", "está diciendo", "va a decir"] },
      v21: { infinitivo: "preocuparse", respuesta: "te preocupes", formas: ["te preocupas", "te has preocupado", "te preocupaste", "te preocupabas", "te habías preocupado", "te preocupes", "te estás preocupando", "te vas a preocupar"] },
      v22: { infinitivo: "hablar", respuesta: "voy a hablar", formas: ["hablo", "he hablado", "hablé", "hablaba", "había hablado", "hable", "estoy hablando", "voy a hablar"] },
      v23: { infinitivo: "responder", respuesta: "respondió", formas: ["responde", "ha respondido", "respondió", "respondía", "había respondido", "responda", "está respondiendo", "va a responder"] },
      v24: { infinitivo: "sacar", respuesta: "había sacado", formas: ["saca", "ha sacado", "sacó", "sacaba", "había sacado", "saque", "está sacando", "va a sacar"] },

      v25: { infinitivo: "recordar", respuesta: "recordó", formas: ["recuerda", "ha recordado", "recordó", "recordaba", "había recordado", "recuerde", "está recordando", "va a recordar"] },
      v26: { infinitivo: "venir", respuesta: "había venido", formas: ["viene", "ha venido", "vino", "venía", "había venido", "venga", "está viniendo", "va a venir"] },
      v27: { infinitivo: "preguntar", respuesta: "había preguntado", formas: ["pregunta", "ha preguntado", "preguntó", "preguntaba", "había preguntado", "pregunte", "está preguntando", "va a preguntar"] },
      v28: { infinitivo: "estar", respuesta: "estaba", formas: ["está", "ha estado", "estuvo", "estaba", "había estado", "esté", "está estando", "va a estar"] },
      v29: { infinitivo: "dar", respuesta: "había dado", formas: ["da", "ha dado", "dio", "daba", "había dado", "dé", "está dando", "va a dar"] },
      v30: { infinitivo: "parecer", respuesta: "parecía", formas: ["parece", "ha parecido", "pareció", "parecía", "había parecido", "parezca", "está pareciendo", "va a parecer"] },

      v31: { infinitivo: "descubrir", respuesta: "descubrió", formas: ["descubre", "ha descubierto", "descubrió", "descubría", "había descubierto", "descubra", "está descubriendo", "va a descubrir"] },
      v32: { infinitivo: "robar", respuesta: "había robado", formas: ["roba", "ha robado", "robó", "robaba", "había robado", "robe", "está robando", "va a robar"] },
      v33: { infinitivo: "tomar", respuesta: "había tomado", formas: ["toma", "ha tomado", "tomó", "tomaba", "había tomado", "tome", "está tomando", "va a tomar"] },
      v34: { infinitivo: "esconder", respuesta: "había escondido", formas: ["esconde", "ha escondido", "escondió", "escondía", "había escondido", "esconda", "está escondiendo", "va a esconder"] },

      v35: { infinitivo: "reírse", respuesta: "se rió", formas: ["se ríe", "se ha reído", "se rió", "se reía", "se había reído", "se ría", "se está riendo", "se va a reír"] },
      v36: { infinitivo: "abrazar", respuesta: "abrazó", formas: ["abraza", "ha abrazado", "abrazó", "abrazaba", "había abrazado", "abrace", "está abrazando", "va a abrazar"] },
      v37: { infinitivo: "comprar", respuesta: "voy a comprar", formas: ["compro", "he comprado", "compré", "compraba", "había comprado", "compre", "estoy comprando", "voy a comprar"] },
      v38: { infinitivo: "decir", respuesta: "dijo", formas: ["dice", "ha dicho", "dijo", "decía", "había dicho", "diga", "está diciendo", "va a decir"] },

      v39: { infinitivo: "reír", respuesta: "rió", formas: ["ríe", "ha reído", "rió", "reía", "había reído", "ría", "está riendo", "va a reír"] },
      v40: { infinitivo: "acariciar", respuesta: "acarició", formas: ["acaricia", "ha acariciado", "acarició", "acariciaba", "había acariciado", "acaricie", "está acariciando", "va a acariciar"] },
      v41: { infinitivo: "ser", respuesta: "eres", formas: ["eres", "has sido", "fuiste", "eras", "habías sido", "seas", "estás siendo", "vas a ser"] },
      v42: { infinitivo: "decir", respuesta: "dijo", formas: ["dice", "ha dicho", "dijo", "decía", "había dicho", "diga", "está diciendo", "va a decir"] },
      v43: { infinitivo: "ronronear", respuesta: "ronroneó", formas: ["ronronea", "ha ronroneado", "ronroneó", "ronroneaba", "había ronroneado", "ronronee", "está ronroneando", "va a ronronear"] },
      v44: { infinitivo: "aceptar", respuesta: "aceptó", formas: ["acepta", "ha aceptado", "aceptó", "aceptaba", "había aceptado", "acepte", "está aceptando", "va a aceptar"] },
      v45: { infinitivo: "estar", respuesta: "estaban", formas: ["están", "han estado", "estuvieron", "estaban", "habían estado", "estén", "están estando", "van a estar"] }
    };

    function desplegable(id) {
      const verbo = verbos[id];
      let opciones = `<option value="" disabled selected>${verbo.infinitivo}</option>`;
      verbo.formas.forEach(function(forma) {
        opciones += `<option value="${forma}">${forma}</option>`;
      });
      return `<select data-respuesta="${verbo.respuesta}">${opciones}</select>`;
    }

    document.getElementById("historia").innerHTML = `
      <p>
        Lucía <span class="verbo-visible">vivía</span> en Ciudad de Guatemala con su abuela Rosa. Las dos
        ${desplegable("v02")} muy bien y
        ${desplegable("v03")} muchas tradiciones familiares. Cada domingo
        ${desplegable("v04")} juntas el desayuno típico y
        ${desplegable("v05")} historias de la familia.
      </p>

      <p>
        Un martes por la tarde, Lucía
        ${desplegable("v06")} a casa después del trabajo y
        ${desplegable("v07")} algo extraño: el collar de jade de su abuela, que
        ${desplegable("v08")} a la bisabuela durante tres generaciones,
        ${desplegable("v09")} de la mesita de noche. La abuela
        ${desplegable("v10")} por teléfono a varias personas, pero nadie
        ${desplegable("v11")} nada del collar.
      </p>

      <p>
        Muy preocupada, esa misma noche Lucía no
        ${desplegable("v12")} dormir. Esa mañana,
        ${desplegable("v13")} a su amigo Carlos, que
        ${desplegable("v14")} detective muy conocido en el barrio. Carlos
        ${desplegable("v15")} en diez minutos y, en ese momento,
        ${desplegable("v16")} la habitación con mucho cuidado. Mientras tanto, la abuela Rosa
        ${desplegable("v17")} en voz baja, sentada en su sillón favorito.
      </p>

      <p class="dialogo">
        —${desplegable("v18")} que tú
        ${desplegable("v19")} el collar pronto —
        ${desplegable("v20")} la abuela Rosa con voz triste y los ojos húmedos.
      </p>

      <p class="dialogo">
        —No ${desplegable("v21")}, doña Rosa. Esta tarde
        ${desplegable("v22")} con todos los vecinos —
        ${desplegable("v23")} Carlos con calma, sin dejar de mirar las fotos que
        ${desplegable("v24")}.
      </p>

      <p>
        De repente, Lucía
        ${desplegable("v25")} algo importante: el día anterior
        ${desplegable("v26")} un hombre desconocido a la puerta.
        ${desplegable("v27")} por la señora Rosa, pero ella no
        ${desplegable("v28")} en casa. En ese momento, Lucía no le
        ${desplegable("v29")} importancia. Pero entonces todo le
        ${desplegable("v30")} sospechoso.
      </p>

      <p>
        Después de dos horas de investigación, Carlos
        ${desplegable("v31")} la verdad. El collar no lo
        ${desplegable("v32")} ningún ladrón. Michi, el gato travieso de la abuela, lo
        ${desplegable("v33")} durante la noche y lo
        ${desplegable("v34")} entre los cojines del sofá.
      </p>

      <p>
        Lucía
        ${desplegable("v35")} y
        ${desplegable("v36")} a su abuela con fuerza.
      </p>

      <p class="dialogo">
        —¡El próximo mes
        ${desplegable("v37")} una caja con llave para guardar las joyas! —
        ${desplegable("v38")} Lucía entre carcajadas.
      </p>

      <p>
        La abuela Rosa también
        ${desplegable("v39")}, aliviada, y
        ${desplegable("v40")} a Michi con cariño. «
        ${desplegable("v41")} un ladrón con mucho estilo», le
        ${desplegable("v42")} al gato. Michi
        ${desplegable("v43")} feliz. Carlos
        ${desplegable("v44")} una taza de café antes de irse. En ese momento, todos
        ${desplegable("v45")} tranquilos.
      </p>
    `;

    document.getElementById("revisar").addEventListener("click", function () {
      const selects = document.querySelectorAll("select");
      let correctas = 0;

      selects.forEach(function (select) {
        select.classList.remove("correcto", "incorrecto");

        if (select.value === select.dataset.respuesta) {
          select.classList.add("correcto");
          correctas++;
        } else {
          select.classList.add("incorrecto");
        }
      });

      document.getElementById("resultado").innerHTML =
        '<span class="puntaje">' + correctas + " / " + selects.length + "</span>";
    });

    document.getElementById("reiniciar").addEventListener("click", function () {
      const selects = document.querySelectorAll("select");

      selects.forEach(function (select) {
        select.selectedIndex = 0;
        select.classList.remove("correcto", "incorrecto");
      });

      document.getElementById("resultado").innerHTML = "";
    });
  </script>
</body>
</html>
